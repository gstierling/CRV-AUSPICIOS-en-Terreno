<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mapa de Ubicaciones — CRV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2333;
    --border:#2a3140;
    --text:#e6edf3;
    --text-dim:#8b949e;
    --orange:#f97316;
    --teal:#00d4aa;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    background:var(--panel);
    border-bottom:1px solid var(--border);
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    z-index:10;
  }
  header h1{
    font-size:1.15rem;
    font-weight:800;
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header h1 span.dot{
    width:10px;height:10px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 8px var(--teal);
  }
  .status-text{font-size:.75rem;color:var(--text-dim);}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;
    font-weight:700;
    font-size:.85rem;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:all .15s;
    display:flex;align-items:center;gap:6px;
  }
  button:hover{border-color:var(--orange);}
  button.primary{background:var(--orange);border-color:var(--orange);color:#0d1117;}
  button.primary:hover{filter:brightness(1.08);}
  button.active{background:var(--teal);border-color:var(--teal);color:#0d1117;}

  #map{flex:1;width:100%;background:#0d1117;}

  .leaflet-popup{
    --panel:#ffffff;
    --panel-2:#f1f5f9;
    --border:#dde3ea;
    --text:#1e293b;
    --text-dim:#64748b;
  }
  .leaflet-popup-content-wrapper{
    background:var(--panel);
    color:var(--text);
    border-radius:12px;
    border:1px solid var(--border);
    box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:0;width:380px !important;}

  .ficha{padding:16px;}
  .ficha h3{
    margin:0 0 4px 0;font-size:1rem;font-weight:800;color:var(--orange);
  }
  .ficha .addr{font-size:.78rem;color:var(--text-dim);margin-bottom:10px;}
  .ficha .badge{
    display:inline-block;font-size:.68rem;font-weight:700;
    padding:2px 8px;border-radius:20px;background:rgba(0,150,120,.12);
    color:#00987a;margin-bottom:10px;
  }
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-group{margin-bottom:9px;}
  .field-group label{
    display:block;font-size:.68rem;text-transform:uppercase;
    letter-spacing:.03em;color:var(--text-dim);margin-bottom:3px;font-weight:700;
  }
  .field-fixed{font-size:.85rem;color:var(--text);}
  .field-group input, .field-group textarea, .field-group select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:6px 8px;font-family:inherit;
    font-size:.83rem;
  }
  .field-group select:disabled, .field-group input:disabled{
    opacity:.5;cursor:not-allowed;
  }
  .field-group select{appearance:none;background-image:linear-gradient(45deg, transparent 50%, var(--orange) 50%),linear-gradient(135deg, var(--orange) 50%, transparent 50%);background-position:calc(100% - 16px) center, calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .field-group textarea{resize:vertical;min-height:44px;}
  .save-btn{
    width:100%;margin-top:6px;justify-content:center;
    background:var(--teal);border-color:var(--teal);color:#0d1117;
  }
  .save-msg{font-size:.72rem;margin-top:6px;text-align:center;height:14px;}
  .save-msg.ok{color:#00987a;}
  .save-msg.err{color:#dc2626;}

  .clave-strip{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;margin-bottom:12px;
  }
  .clave-label{
    font-size:.66rem;font-weight:700;color:var(--text-dim);
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;
  }
  .clave-boxes{display:flex;gap:3px;}
  .clave-box{
    flex:1;height:28px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);border-radius:5px;background:#fff;
    font-weight:800;font-size:.75rem;color:var(--text);cursor:pointer;user-select:none;
    transition:all .15s;
  }
  .clave-box.clave-ok{background:#00987a;border-color:#00987a;color:#fff;}
  .clave-box.clave-err{background:#dc2626;border-color:#dc2626;color:#fff;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--teal);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:.85rem;font-weight:700;
    z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .crv-div-icon{background:transparent;border:none;}
  .marker-wrap{display:flex;align-items:center;}
  .marker-pin{
    width:36px;height:36px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:3px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
  }
  .marker-pin.green{background:var(--teal);}
  .marker-pin.red{background:#f85149;}
  .marker-label{
    margin-left:8px;
    background:var(--panel);
    color:var(--text);
    font-size:.68rem;
    font-weight:800;
    padding:3px 8px;
    border-radius:6px;
    border:1px solid var(--border);
    white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  #addModeBanner{
    position:absolute;top:70px;left:50%;transform:translateX(-50%);
    background:var(--orange);color:#0d1117;font-weight:800;font-size:.8rem;
    padding:8px 16px;border-radius:20px;z-index:1000;display:none;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }

  /* Panel flotante de filtros */
  #filterPanel{
    position:fixed;top:90px;right:16px;
    display:flex;flex-direction:column;gap:8px;z-index:900;
  }
  .filter-btn{
    width:46px;height:46px;border-radius:10px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-size:.62rem;font-weight:800;line-height:1.1;text-align:center;
    display:flex;align-items:center;justify-content:center;padding:2px;
    cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .filter-btn:hover{border-color:var(--orange);}
  .filter-btn.active{background:var(--orange);border-color:var(--orange);color:#0d1117;}
  .filter-popover{
    position:fixed;right:72px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:12px;min-width:190px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:1001;display:none;
  }
  .filter-popover.show{display:block;}
  .filter-popover h4{margin:0 0 8px;font-size:.78rem;color:var(--orange);}
  .filter-popover .opt-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .filter-chip{
    padding:4px 10px;border-radius:16px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);font-size:.72rem;cursor:pointer;font-weight:700;
  }
  .filter-chip.selected{background:var(--teal);border-color:var(--teal);color:#0d1117;}
  .filter-popover input[type=text]{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:6px 8px;font-size:.8rem;
  }
  .filter-clear{
    margin-top:8px;font-size:.7rem;color:var(--text-dim);text-decoration:underline;
    cursor:pointer;background:none;border:none;padding:0;
  }

  /* Foto pegada en la ficha */
  .photo-drop{
    border:2px dashed var(--border);border-radius:8px;padding:10px;
    text-align:center;cursor:pointer;outline:none;
  }
  .photo-drop:focus{border-color:var(--orange);}
  .photo-preview{max-width:100%;border-radius:6px;display:block;margin:0 auto;}
  .photo-hint{font-size:.7rem;color:var(--text-dim);}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="dot"></span> Mapa de Ubicaciones — CRV</h1>
    <div class="status-text" id="statusText">Cargando ubicaciones…</div>
    <div class="status-text" id="centerText" style="font-weight:700;color:var(--orange);"></div>
    <div class="toolbar">
      <button id="btnAddMode">➕ Agregar ubicación</button>
      <button id="btnRefresh">🔄 Actualizar</button>
    </div>
  </header>
  <div id="addModeBanner">Haz clic en el mapa para agregar una ubicación</div>
  <div id="map"></div>
  <div id="filterPanel"></div>
  <div class="filter-popover" id="filterPopover"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN — completar cuando tengas el backend listo
   ========================================================= */
const CONFIG = {
  // URL del Web App de Apps Script (doGet/doPost). Pídesela a Claude que la inserte
  // aquí apenas la tengas desplegada.
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwLRioKIesgGBJmAOlYMDiP5oWNr6FoqFviI9aFU932tdtNj-UbfHykPJFNphgTdLz6/exec",

  // Centro inicial del mapa (por defecto: Plaza Italia, Santiago).
  // Ajusta lat/lng al centro real de tu área de ~10 km².
  CENTER: [-33.41270, -70.60793],
  ZOOM: 13,

  AUTO_REFRESH_MS: 30000
};

/* =========================================================
   ESTADO
   ========================================================= */
let map, markersLayer;
let addMode = false;
let locations = []; // cache local

/* =========================================================
   INIT MAPA (Leaflet + OpenStreetMap — sin API key,
   muestra más nombres de calles a medida que haces zoom)
   ========================================================= */
function initMap(){
  map = L.map('map', { zoomControl: true }).setView(CONFIG.CENTER, CONFIG.ZOOM);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);

  map.on('click', (e) => {
    if (addMode) {
      openCreateForm(e.latlng);
    }
  });

  map.on('moveend', updateCenterReadout);
  updateCenterReadout();
}

function updateCenterReadout(){
  const c = map.getCenter();
  const z = map.getZoom();
  document.getElementById('centerText').textContent =
    `Centro actual: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)} · zoom ${z}`;
}

/* =========================================================
   CARGA DE DATOS
   ========================================================= */
async function loadLocations(){
  setStatus("Cargando ubicaciones…");
  try{
    if (!isConfigured()){
      setStatus("⚠️ Falta configurar APPS_SCRIPT_URL — mostrando datos de ejemplo.");
      locations = demoData();
    } else {
      const res = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=list");
      const data = await res.json();
      locations = data.locations || [];
      setStatus(`${locations.length} ubicación(es) · actualizado ${new Date().toLocaleTimeString('es-CL')}`);
    }
    renderMarkers();
  }catch(err){
    console.error(err);
    setStatus("⚠️ Error al cargar datos. Reintentando en 30s…");
  }
}

function isConfigured(){
  return CONFIG.APPS_SCRIPT_URL && CONFIG.APPS_SCRIPT_URL.indexOf("PEGA_AQUI") === -1;
}

function demoData(){
  return [
    {
      id: "demo-1",
      nombre: "Punto de ejemplo",
      direccion: "Av. Providencia 1234, Santiago",
      categoria: "Punto de control",
      lat: -33.4372, lng: -70.6206,
      notas: "Este es un dato de ejemplo — conecta tu Google Sheet para ver datos reales.",
      ruido: "3", soportePrincipal: "Stand", auspiciador: "Marca Ejemplo",
      fechaInicio: "", fechaTermino: "", ofrecidoAuspiciador: "", objetivos: "", foto: "",
      superficieDisponible: "20 m²"
    }
  ];
}

/* =========================================================
   RENDER DE MARCADORES
   ========================================================= */
function renderMarkers(){
  markersLayer.clearLayers();
  locations.filter(matchesFilters).forEach(loc => {
    const marker = L.marker([loc.lat, loc.lng], { icon: buildIcon(loc) });
    marker.bindPopup(() => buildFichaHTML(loc), { minWidth: 280 });
    marker.on('popupopen', (e) => wireFichaEvents(e.popup, loc, marker));
    marker.addTo(markersLayer);
    loc.__marker = marker;
  });
}

function buildIcon(loc){
  const hasSponsor = !!(loc.auspiciador && String(loc.auspiciador).trim());
  const color = hasSponsor ? 'red' : 'green';
  const label = hasSponsor
    ? `<div class="marker-label">${escapeHtml(loc.auspiciador)}</div>`
    : '';
  const html = `<div class="marker-wrap"><div class="marker-pin ${color}"></div>${label}</div>`;
  return L.divIcon({
    html,
    className: 'crv-div-icon',
    iconSize: [260, 44],
    iconAnchor: [18, 36],
    popupAnchor: [0, -10]
  });
}

/* =========================================================
   FICHA (popup): datos fijos + campos editables
   ========================================================= */
function buildFichaHTML(loc){
  const claveLetras = "AUSPICIOS".split('');
  return `
    <div class="ficha" data-id="${loc.id}">
      <div class="clave-strip">
        <div class="clave-label">🔒 Clave para editar Ruido / Superficie disponible</div>
        <div class="clave-boxes">
          ${claveLetras.map((ch,i) => `<div class="clave-box" data-idx="${i}">${ch}</div>`).join('')}
        </div>
      </div>

      <span class="badge">${escapeHtml(loc.categoria || 'Sin categoría')}</span>
      <h3>${escapeHtml(loc.nombre)}</h3>
      <div class="addr">${escapeHtml(loc.direccion || '')}</div>

      <div class="field-grid">
        <div class="field-group">
          <label>🔒 Ruido</label>
          <select data-field="ruido" disabled>
            <option value="">—</option>
            ${[1,2,3,4,5].map(n =>
              `<option value="${n}" ${String(loc.ruido)===String(n)?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label>Soporte principal</label>
          <select data-field="soportePrincipal">
            <option value="">—</option>
            ${['Stand','Arco'].map(o =>
              `<option value="${o}" ${loc.soportePrincipal===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-grid">
        <div class="field-group">
          <label>🔒 Superficie disponible</label>
          <input type="text" data-field="superficieDisponible" placeholder="m²" value="${escapeHtml(loc.superficieDisponible||'')}" disabled>
        </div>
        <div class="field-group">
          <label>Auspiciador</label>
          <input type="text" data-field="auspiciador" value="${escapeHtml(loc.auspiciador||'')}">
        </div>
      </div>
      <div class="field-group">
        <label>Entre qué fechas</label>
        <div style="display:flex;gap:6px;">
          <input type="date" data-field="fechaInicio" value="${escapeHtml(loc.fechaInicio||'')}">
          <input type="date" data-field="fechaTermino" value="${escapeHtml(loc.fechaTermino||'')}">
        </div>
      </div>
      <div class="field-group">
        <label>Ofrecido a algún auspiciador</label>
        <input type="text" data-field="ofrecidoAuspiciador" value="${escapeHtml(loc.ofrecidoAuspiciador||'')}">
      </div>
      <div class="field-group">
        <label>Objetivos</label>
        <textarea data-field="objetivos">${escapeHtml(loc.objetivos||'')}</textarea>
      </div>
      <div class="field-group">
        <label>Notas</label>
        <textarea data-field="notas">${escapeHtml(loc.notas||'')}</textarea>
      </div>
      <div class="field-group">
        <label>Foto</label>
        <div class="photo-drop" tabindex="0">
          <img class="photo-preview" style="display:${loc.foto ? 'block':'none'}" src="${loc.foto||''}">
          <div class="photo-hint" style="display:${loc.foto ? 'none':'block'}">Copia una imagen y presiona Ctrl+V aquí</div>
        </div>
      </div>

      <button class="save-btn">💾 Guardar cambios</button>
      <div class="save-msg"></div>
    </div>
  `;
}

const EDITABLE_FIELDS = ["ruido","soportePrincipal","auspiciador","fechaInicio","fechaTermino","ofrecidoAuspiciador","objetivos","notas","superficieDisponible"];
const CLAVE_SECUENCIA = "SOICIPSAU".split('');

function wireFichaEvents(popup, loc, marker){
  const el = popup.getElement();
  if (!el) return;
  const btn = el.querySelector('.save-btn');
  const msg = el.querySelector('.save-msg');

  // Juego de clave para desbloquear Ruido / Superficie disponible
  const claveBoxes = el.querySelectorAll('.clave-box');
  const claveLabel = el.querySelector('.clave-label');
  let claveProgreso = 0;
  const claveUsados = new Set();
  claveBoxes.forEach(box => {
    box.addEventListener('click', () => {
      const idx = Number(box.dataset.idx);
      if (claveUsados.has(idx)) return;
      const letra = box.textContent;
      if (letra === CLAVE_SECUENCIA[claveProgreso]){
        claveUsados.add(idx);
        box.classList.add('clave-ok');
        claveProgreso++;
        if (claveProgreso === CLAVE_SECUENCIA.length){
          ['ruido','superficieDisponible'].forEach(f => {
            const input = el.querySelector(`[data-field="${f}"]`);
            if (input) input.disabled = false;
          });
          claveLabel.textContent = '🔓 Ruido / Superficie disponible desbloqueados';
          showToast('Campos desbloqueados');
        }
      } else {
        claveProgreso = 0;
        claveUsados.clear();
        claveBoxes.forEach(b => b.classList.remove('clave-ok'));
        box.classList.add('clave-err');
        setTimeout(() => box.classList.remove('clave-err'), 350);
      }
    });
  });

  const photoDrop = el.querySelector('.photo-drop');
  if (photoDrop){
    photoDrop.addEventListener('paste', (e) => {
      const items = (e.clipboardData || window.clipboardData).items;
      for (const item of items){
        if (item.type.indexOf('image') === 0){
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (ev) => {
            loc.foto = ev.target.result;
            const img = photoDrop.querySelector('.photo-preview');
            const hint = photoDrop.querySelector('.photo-hint');
            img.src = loc.foto;
            img.style.display = 'block';
            hint.style.display = 'none';
          };
          reader.readAsDataURL(blob);
          e.preventDefault();
        }
      }
    });
  }

  btn.addEventListener('click', async () => {
    const updated = { id: loc.id, foto: loc.foto || '' };
    EDITABLE_FIELDS.forEach(f => {
      const input = el.querySelector(`[data-field="${f}"]`);
      if (input) updated[f] = input.value;
    });
    btn.disabled = true;
    btn.textContent = "Guardando…";
    try{
      await saveLocation(updated);
      Object.assign(loc, updated);
      if (marker) marker.setIcon(buildIcon(loc));
      msg.textContent = "Guardado ✓";
      msg.className = "save-msg ok";
      showToast("Cambios guardados");
    }catch(err){
      console.error(err);
      msg.textContent = "Error al guardar";
      msg.className = "save-msg err";
    }finally{
      btn.disabled = false;
      btn.textContent = "💾 Guardar cambios";
    }
  });
}

async function saveLocation(payload){
  if (!isConfigured()) throw new Error("Backend no configurado");
  await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // evita preflight CORS
    body: JSON.stringify({ action: 'update', data: payload })
  });
}

/* =========================================================
   MODO "AGREGAR UBICACIÓN"
   ========================================================= */
function toggleAddMode(){
  addMode = !addMode;
  document.getElementById('btnAddMode').classList.toggle('active', addMode);
  document.getElementById('addModeBanner').style.display = addMode ? 'block' : 'none';
  map.getContainer().style.cursor = addMode ? 'crosshair' : '';
}

async function openCreateForm(latlng){
  const nombre = prompt("Nombre de la ubicación:");
  if (!nombre) return;
  const direccion = prompt("Dirección:") || "";
  const categoria = prompt("Categoría:") || "";

  const newLoc = {
    id: 'loc-' + Date.now(),
    nombre, direccion, categoria,
    lat: latlng.lat, lng: latlng.lng,
    notas: "", ruido: "", soportePrincipal: "", auspiciador: "",
    fechaInicio: "", fechaTermino: "", ofrecidoAuspiciador: "", objetivos: "", foto: "",
    superficieDisponible: ""
  };

  try{
    if (isConfigured()){
      await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'create', data: newLoc })
      });
    }
    locations.push(newLoc);
    renderMarkers();
    showToast("Ubicación agregada");
  }catch(err){
    console.error(err);
    alert("No se pudo guardar la nueva ubicación.");
  }
  toggleAddMode();
}

/* =========================================================
   FILTROS (panel flotante lateral)
   ========================================================= */
const FILTER_FIELDS = [
  { key:'categoria', label:'Categoría', type:'select', options:() => [...new Set(locations.map(l=>l.categoria).filter(Boolean))] },
  { key:'ruido', label:'Ruido', type:'select', options:() => ['1','2','3','4','5'] },
  { key:'soportePrincipal', label:'Soporte', type:'select', options:() => ['Stand','Arco'] },
  { key:'auspiciador', label:'Auspicio', type:'presence' },
  { key:'ofrecidoAuspiciador', label:'Ofrecido a', type:'text' },
  { key:'objetivos', label:'Objetivos', type:'text' },
  { key:'fechas', label:'Fechas', type:'text', matchKeys:['fechaInicio','fechaTermino'] },
  { key:'notas', label:'Notas', type:'text' }
];
let activeFilters = {};
let openPopoverKey = null;

function buildFilterPanel(){
  const panel = document.getElementById('filterPanel');
  panel.innerHTML = FILTER_FIELDS.map(f =>
    `<button class="filter-btn" data-key="${f.key}">${f.label}</button>`
  ).join('');
  panel.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const field = FILTER_FIELDS.find(f => f.key === btn.dataset.key);
      togglePopover(btn, field);
    });
  });
}

function togglePopover(btn, field){
  if (openPopoverKey === field.key){
    closePopover();
    return;
  }
  openPopover(btn, field);
}

function closePopover(){
  const pop = document.getElementById('filterPopover');
  pop.classList.remove('show');
  openPopoverKey = null;
}

function openPopover(btn, field){
  const pop = document.getElementById('filterPopover');
  const rect = btn.getBoundingClientRect();
  pop.style.top = rect.top + 'px';
  pop.innerHTML = renderPopoverContent(field);
  pop.classList.add('show');
  openPopoverKey = field.key;
  wirePopoverEvents(field, btn);
}

function renderPopoverContent(field){
  const current = activeFilters[field.key];
  let body = `<h4>${field.label}</h4>`;
  if (field.type === 'select'){
    const opts = field.options();
    body += opts.length
      ? `<div class="opt-row">${opts.map(o =>
          `<span class="filter-chip ${current===o?'selected':''}" data-val="${o}">${o}</span>`
        ).join('')}</div>`
      : `<div style="font-size:.72rem;color:var(--text-dim);">Sin datos aún</div>`;
  } else if (field.type === 'presence'){
    body += `<div class="opt-row">${['Con','Sin'].map(o =>
      `<span class="filter-chip ${current===o?'selected':''}" data-val="${o}">${o}</span>`
    ).join('')}</div>`;
  } else {
    body += `<input type="text" id="filterTextInput" placeholder="Buscar…" value="${current||''}">`;
  }
  if (current) body += `<button class="filter-clear" id="clearFilterBtn">Quitar filtro</button>`;
  return body;
}

function wirePopoverEvents(field, btn){
  const pop = document.getElementById('filterPopover');
  pop.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.val;
      if (activeFilters[field.key] === val) delete activeFilters[field.key];
      else activeFilters[field.key] = val;
      renderMarkers();
      updateFilterButtonStates();
      openPopover(btn, field);
    });
  });
  const textInput = pop.querySelector('#filterTextInput');
  if (textInput){
    textInput.addEventListener('input', () => {
      const v = textInput.value.trim();
      if (v) activeFilters[field.key] = v; else delete activeFilters[field.key];
      renderMarkers();
      updateFilterButtonStates();
    });
  }
  const clearBtn = pop.querySelector('#clearFilterBtn');
  if (clearBtn){
    clearBtn.addEventListener('click', () => {
      delete activeFilters[field.key];
      renderMarkers();
      updateFilterButtonStates();
      closePopover();
    });
  }
}

function updateFilterButtonStates(){
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', !!activeFilters[btn.dataset.key]);
  });
}

function matchesFilters(loc){
  return FILTER_FIELDS.every(f => {
    const val = activeFilters[f.key];
    if (!val) return true;
    if (f.type === 'select') return String(loc[f.key]) === val;
    if (f.type === 'presence'){
      const has = !!(loc[f.key] && String(loc[f.key]).trim());
      return val === 'Con' ? has : !has;
    }
    const source = f.matchKeys ? f.matchKeys.map(k => loc[k]||'').join(' ') : (loc[f.key]||'');
    return String(source).toLowerCase().includes(val.toLowerCase());
  });
}

document.addEventListener('click', (e) => {
  const pop = document.getElementById('filterPopover');
  const panel = document.getElementById('filterPanel');
  if (openPopoverKey && !pop.contains(e.target) && !panel.contains(e.target)){
    closePopover();
  }
});

/* =========================================================
   UTILIDADES
   ========================================================= */
function setStatus(t){ document.getElementById('statusText').textContent = t; }

function showToast(t){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

/* =========================================================
   ARRANQUE
   ========================================================= */
document.getElementById('btnAddMode').addEventListener('click', toggleAddMode);
document.getElementById('btnRefresh').addEventListener('click', loadLocations);

buildFilterPanel();
initMap();
loadLocations();
setInterval(loadLocations, CONFIG.AUTO_REFRESH_MS);
</script>
