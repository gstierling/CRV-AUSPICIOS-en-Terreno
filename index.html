<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CicloRecreoVía AUSPICIOS UBICACIONES</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.js"></script>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel-2:#1c2333;
    --border:#2a3140;
    --text:#e6edf3;
    --text-dim:#8b949e;
    --orange:#f97316;
    --teal:#00d4aa;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;flex-direction:column;height:100vh;}

  header{
    background:#1e40af;
    border-bottom:1px solid #1e3a8a;
    padding:14px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    z-index:10;
  }
  header h1{
    font-size:1.725rem;
    font-weight:800;
    margin:0;
    display:flex;
    align-items:center;
    gap:10px;
    color:#ffffff;
  }
  header h1 span.dot{
    width:10px;height:10px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 8px var(--teal);
  }
  .status-text{font-size:.75rem;color:rgba(255,255,255,.75);}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;}
  button{
    font-family:inherit;
    font-weight:700;
    font-size:.85rem;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    transition:all .15s;
    display:flex;align-items:center;gap:6px;
  }
  button:hover{border-color:var(--orange);}
  button.primary{background:var(--orange);border-color:var(--orange);color:#0d1117;}
  button.primary:hover{filter:brightness(1.08);}
  button.active{background:var(--teal);border-color:var(--teal);color:#0d1117;}

  #map{flex:1;width:100%;background:#0d1117;}

  .leaflet-popup{
    --panel:#ffffff;
    --panel-2:#f1f5f9;
    --border:#dde3ea;
    --text:#1e293b;
    --text-dim:#64748b;
  }
  .leaflet-popup-content-wrapper{
    background:var(--panel);
    color:var(--text);
    border-radius:12px;
    border:1px solid var(--border);
    box-shadow:0 12px 32px rgba(0,0,0,.35);
  }
  /* Ficha abierta hacia la derecha del pin, separada 5x el ancho del pin.
     Sin cuña/indicador — se retiró por pedido del usuario. */
  .leaflet-popup-tip-container{ display:none !important; }
  .leaflet-popup-content{margin:0;width:560px !important;}
  .leaflet-popup.foto-popup .leaflet-popup-content{width:auto !important;max-width:min(1080px, 78vw) !important;}

  .ficha{padding:16px;position:relative;}
  .ficha-close-btn{
    position:absolute;top:8px;right:8px;width:26px;height:26px;
    border-radius:50%;border:none;background:var(--panel-2);color:var(--text-dim);
    font-size:.8rem;cursor:pointer;line-height:1;z-index:5;
    display:flex;align-items:center;justify-content:center;
  }
  .ficha-close-btn:hover{background:#fee2e2;color:#dc2626;}
  .ficha h3{
    margin:0 0 4px 0;font-size:1rem;font-weight:800;color:var(--orange);
  }
  .ficha .addr{font-size:.78rem;color:var(--text-dim);margin-bottom:10px;}
  .ficha .badge{
    display:inline-block;font-size:.68rem;font-weight:700;
    padding:2px 8px;border-radius:20px;background:rgba(0,150,120,.12);
    color:#00987a;margin-bottom:8px;
  }
  .ficha-title-input{
    display:block;width:100%;text-align:center;border:none;
    background:transparent;font-family:inherit;font-weight:800;
    font-size:1.05rem;color:#2563eb;padding:4px 6px;
    border-radius:6px;margin:0 auto 4px auto;
    resize:none;overflow:hidden;line-height:1.3;
  }
  .ficha-title-input.ficha-auspiciador-input{
    font-size:1.43rem;color:#7c2d12;font-weight:800;margin-bottom:8px;
    background:#fef08a;padding:6px 10px;letter-spacing:.01em;
  }
  .ficha-title-input:focus{outline:none;background:var(--panel-2);}
  .ficha-title-input.ficha-auspiciador-input:focus{background:#fde68a;}
  .ficha-title-input::placeholder{color:var(--text-dim);font-weight:600;}
  .ficha-columns{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field-group{margin-bottom:9px;}
  .field-group label{
    display:block;font-size:.98rem;
    letter-spacing:0;color:#334155;margin-bottom:3px;font-weight:800;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .field-fixed{font-size:.85rem;color:var(--text);}
  .field-group input, .field-group textarea, .field-group select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:6px 8px;font-family:inherit;
    font-size:1rem;
  }
  .field-group select:disabled, .field-group input:disabled{
    opacity:.5;cursor:not-allowed;
  }
  .field-group select{appearance:none;background-image:linear-gradient(45deg, transparent 50%, var(--orange) 50%),linear-gradient(135deg, var(--orange) 50%, transparent 50%);background-position:calc(100% - 16px) center, calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .field-group textarea{resize:vertical;min-height:44px;}
  .save-btn{
    width:100%;margin-top:6px;justify-content:center;
    background:var(--teal);border-color:var(--teal);color:#0d1117;
  }
  .save-msg{font-size:.72rem;margin-top:6px;text-align:center;height:14px;}
  .save-msg.ok{color:#00987a;}
  .save-msg.err{color:#dc2626;}

  .clave-strip{
    background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    padding:8px 10px;margin-bottom:12px;
  }
  .clave-label{
    font-size:.68rem;font-weight:800;color:#334155;
    text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;
  }
  .clave-boxes{display:flex;gap:3px;max-width:340px;}
  .clave-box{
    flex:1;height:28px;display:flex;align-items:center;justify-content:center;
    border:1px solid var(--border);border-radius:5px;background:#fff;
    font-weight:800;font-size:.75rem;color:var(--text);cursor:pointer;user-select:none;
    transition:all .15s;
  }
  .clave-box.clave-ok{background:#00987a;border-color:#00987a;color:#fff;}
  .clave-box.clave-err{background:#dc2626;border-color:#dc2626;color:#fff;}

  .chip-group{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-checkbox{
    display:flex;align-items:center;gap:5px;
    border:1px solid var(--border);border-radius:16px;
    padding:5px 11px;font-size:.85rem;font-weight:700;
    background:var(--panel-2);color:var(--text);cursor:pointer;user-select:none;
    transition:all .15s;
  }
  .chip-checkbox input{width:auto !important;margin:0;accent-color:#00987a;}
  .chip-checkbox.checked{background:#00987a;border-color:#00987a;color:#fff;}

  .multiselect-dropdown{position:relative;}
  .multiselect-summary{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:6px 8px;font-family:inherit;
    font-size:1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:6px;
  }
  .multiselect-summary::after{content:"▾";color:var(--orange);font-size:.8rem;flex-shrink:0;}
  .multiselect-summary.placeholder{color:var(--text-dim);}
  .multiselect-panel{
    display:none;flex-wrap:wrap;gap:6px;margin-top:6px;
    padding:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  }
  .multiselect-dropdown.open .multiselect-panel{display:flex;}

  /* Pin resaltado mientras su ficha está abierta: se agranda un poco y
     muestra una estrella blanca en el centro (sin halo de color) */
  .crv-div-icon.marker-selected .marker-pin{
    box-shadow:0 3px 10px rgba(0,0,0,.55);
    transform:rotate(-45deg) scale(1.22);
  }
  .crv-div-icon.marker-selected .marker-pin::after{
    content:"★";
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(45deg);
    color:#fff;
    font-size:20px;
    line-height:1;
    text-shadow:0 1px 2px rgba(0,0,0,.5);
  }
  .crv-div-icon.marker-selected{ z-index:1000 !important; }

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--teal);color:var(--text);
    padding:10px 18px;border-radius:8px;font-size:.85rem;font-weight:700;
    z-index:9999;opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .crv-div-icon{background:transparent;border:none;}
  .marker-wrap{display:flex;align-items:center;}
  .marker-pin{
    width:36px;height:36px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:3px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    position:relative;
  }
  .marker-pin.green{background:var(--teal);}
  .marker-pin.red{background:#f85149;}
  .marker-label{
    margin-left:8px;
    background:var(--panel);
    color:var(--text);
    font-size:.68rem;
    font-weight:800;
    padding:3px 8px;
    border-radius:6px;
    border:1px solid var(--border);
    white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  /* Punto de foto geolocalizada: círculo rojo, ahora al doble (18px) con borde amarillo grueso */
  .foto-div-icon{background:transparent;border:none;}
  .foto-point{
    width:18px;height:18px;border-radius:50%;
    background:#dc2626;border:4px solid #fde047;
    box-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .foto-popup-content{padding:8px;}
  .foto-popup-wrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  .foto-popup-img{
    max-width:min(832px, 65vw);max-height:min(832px, 65vh);
    border-radius:8px;display:block;object-fit:contain;
  }
  .foto-popup-side{width:210px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;}
  .foto-popup-label{font-size:.8rem;font-weight:800;color:#334155;}
  .foto-popup-save{
    background:#00987a;color:#fff;border:none;border-radius:6px;
    padding:8px 10px;font-weight:700;font-size:.82rem;cursor:pointer;font-family:inherit;
  }
  .foto-popup-save:hover{filter:brightness(1.08);}
  .foto-popup-msg{font-size:.72rem;color:#00987a;min-height:14px;}
  .foto-popup-lista-titulo{font-size:.76rem;font-weight:800;color:#334155;margin-top:2px;}
  .foto-popup-lista{margin:4px 0 0;padding-left:18px;font-size:.8rem;color:#1e293b;}
  .foto-popup-lista li{margin-bottom:2px;}

  /* Widgets para agregar una foto geolocalizada: botón de carpeta + zona de pegado */
  .icon-svg{width:16px;height:16px;flex-shrink:0;}
  .paste-zone{
    display:flex;align-items:center;gap:6px;
    border:1.5px dashed rgba(255,255,255,.3);border-radius:8px;
    padding:8px 14px;font-size:.8rem;font-weight:700;color:var(--text);
    background:rgba(255,255,255,.03);cursor:text;user-select:none;
    transition:all .15s;
  }
  .paste-zone:hover{border-color:var(--orange);}
  .paste-zone:focus{outline:none;border-color:var(--orange);background:rgba(249,115,22,.08);}
  .paste-zone.paste-ok{border-color:var(--teal);background:rgba(0,212,170,.12);}

  /* "Elige foto" y "Pega foto": colores invertidos para marcar cuál se usó */
  #btnAddFoto.selected, .paste-zone.selected{
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
  }
  #btnAddFoto.selected svg, .paste-zone.selected svg{ color:var(--bg); }

  #addModeBanner{
    position:absolute;top:70px;left:50%;transform:translateX(-50%);
    background:var(--orange);color:#0d1117;font-weight:800;font-size:.8rem;
    padding:8px 16px;border-radius:20px;z-index:1000;display:none;
    box-shadow:0 4px 12px rgba(0,0,0,.4);
  }

  /* Panel de filtros: barra lateral fija con todas las opciones a la vista,
     sin menús emergentes */
  #filterPanel{
    position:fixed;top:90px;right:16px;bottom:16px;width:288px;
    background:rgba(13,17,23,.88);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:14px;overflow-y:auto;z-index:900;
    display:flex;flex-direction:column;gap:16px;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .filter-section-title{
    font-size:.92rem;font-weight:800;color:#fff;margin-bottom:8px;
    padding-bottom:5px;border-bottom:2px solid #dc2626;
  }
  .filter-section.active .filter-section-title{color:#ff8a8a;border-color:#ff8a8a;}
  .filter-section-options{display:flex;flex-wrap:wrap;gap:6px;}
  .filter-chip-opt{
    padding:7px 13px;border-radius:14px;
    background:#dc2626;border:2px solid #7f1d1d;color:#fff;
    font-size:.8rem;font-weight:700;cursor:pointer;text-align:center;
    transition:all .15s;
  }
  .filter-chip-opt:hover{background:#ef4444;}
  .filter-chip-opt.selected{background:#991b1b;border-color:#fff;}
  .filter-section-options .filter-text-input{
    width:100%;background:var(--panel-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:7px 9px;font-size:.85rem;
  }
  .filter-empty{font-size:.72rem;color:rgba(255,255,255,.5);}

  .filter-popover{
    position:fixed;right:72px;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:12px;min-width:190px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:1001;display:none;
  }
  .filter-popover.show{display:block;}
  .filter-popover h4{margin:0 0 8px;font-size:.78rem;color:var(--orange);}
  .filter-clear{
    margin-top:8px;font-size:.7rem;color:var(--text-dim);text-decoration:underline;
    cursor:pointer;background:none;border:none;padding:0;
  }

  /* Foto pegada en la ficha */
  .photo-drop{
    border:2px dashed var(--border);border-radius:8px;padding:10px;
    text-align:center;cursor:pointer;outline:none;
    position:relative;
  }
  .photo-drop:focus{border-color:var(--orange);}
  .photo-preview{max-width:100%;border-radius:6px;display:block;margin:0 auto;cursor:zoom-in;}
  .photo-hint{font-size:.7rem;color:var(--text-dim);}
  .photo-change-btn{
    position:absolute;top:6px;right:6px;display:none;
    background:rgba(13,17,23,.82);color:#fff;border:1px solid rgba(255,255,255,.3);
    border-radius:6px;padding:4px 9px;font-size:.68rem;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .photo-change-btn:hover{background:rgba(13,17,23,.95);}

  /* Visor emergente de foto ampliada */
  .foto-lightbox-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.86);
    display:flex;align-items:center;justify-content:center;
    z-index:5000;cursor:zoom-out;
  }
  .foto-lightbox-img{
    max-width:92vw;max-height:92vh;border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,.6);cursor:default;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="dot"></span> CicloRecreoVía AUSPICIOS UBICACIONES</h1>
    <div class="status-text" id="statusText">Cargando ubicaciones…</div>
    <div class="status-text" id="centerText" style="font-weight:700;color:var(--orange);"></div>
    <div class="toolbar">
      <button id="btnLock">🔒 Bloqueado</button>
      <button id="btnAddFoto" title="Elegir una foto desde una carpeta">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Elige foto
      </button>
      <input type="file" id="fotoFileInput" accept="image/*" style="display:none;">
      <div class="paste-zone" id="pasteZone" tabindex="0" title="Haz clic aquí y presiona Ctrl+V para pegar una imagen copiada">
        <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
        Pega foto
      </div>
      <button id="btnAddMode">➕ Agregar ubicación</button>
      <button id="btnRefresh">🔄 Actualizar</button>
    </div>
  </header>
  <div id="addModeBanner">Haz clic en el mapa para agregar una ubicación</div>
  <div class="filter-popover" id="lockPopover"></div>
  <div id="map"></div>
  <div id="filterPanel"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
/* =========================================================
   CONFIGURACIÓN — completar cuando tengas el backend listo
   ========================================================= */
const CONFIG = {
  // URL del Web App de Apps Script (doGet/doPost). Pídesela a Claude que la inserte
  // aquí apenas la tengas desplegada.
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwLRioKIesgGBJmAOlYMDiP5oWNr6FoqFviI9aFU932tdtNj-UbfHykPJFNphgTdLz6/exec",

  // Centro inicial del mapa (por defecto: Plaza Italia, Santiago).
  // Ajusta lat/lng al centro real de tu área de ~10 km².
  CENTER: [-33.41270, -70.60793],
  ZOOM: 13,

  AUTO_REFRESH_MS: 30000
};

/* =========================================================
   ESTADO
   ========================================================= */
let map, markersLayer, fotoMarkersLayer;
let addMode = false;
let locations = []; // cache local
let fotoPoints = []; // fotos geolocalizadas
let isPopupOpen = false;   // evita que el auto-refresh cierre la ficha mientras se edita
let pendingRender = false;
let selectedMarker = null; // pin actualmente resaltado
let pendingFotoBlob = null; // foto sin GPS esperando que el usuario haga clic en el mapa
let fotoPending = false;

const LOCK_KEY = 'crv_mapa_unlocked';
const CLAVE_SECUENCIA = "SOICIPSAU".split('');
let unlockedGlobal = localStorage.getItem(LOCK_KEY) === '1';

/* =========================================================
   INIT MAPA (Leaflet + OpenStreetMap — sin API key,
   muestra más nombres de calles a medida que haces zoom)
   ========================================================= */
function initMap(){
  map = L.map('map', { zoomControl: true }).setView(CONFIG.CENTER, CONFIG.ZOOM);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  fotoMarkersLayer = L.layerGroup().addTo(map);

  map.on('click', (e) => {
    if (fotoPending && pendingFotoBlob){
      const blob = pendingFotoBlob;
      pendingFotoBlob = null;
      fotoPending = false;
      document.getElementById('addModeBanner').style.display = 'none';
      document.getElementById('addModeBanner').textContent = 'Haz clic en el mapa para agregar una ubicación';
      map.getContainer().style.cursor = '';
      guardarFotoEnMapa(blob, e.latlng.lat, e.latlng.lng);
      return;
    }
    if (addMode) {
      openCreateForm(e.latlng);
      return;
    }
    // Clic en el mapa, fuera de cualquier ficha: la cerramos nosotros (con
    // confirmación si tiene cambios sin guardar), en vez del cierre
    // automático de Leaflet.
    if (selectedMarker){
      intentarCerrarFicha(selectedMarker);
    }
  });

  map.on('moveend', updateCenterReadout);
  updateCenterReadout();

  map.on('popupopen', () => { isPopupOpen = true; });
  map.on('popupclose', () => {
    isPopupOpen = false;
    if (pendingRender){
      pendingRender = false;
      renderMarkers();
    }
  });
}

function updateCenterReadout(){
  const c = map.getCenter();
  const z = map.getZoom();
  document.getElementById('centerText').textContent =
    `Centro actual: ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)} · zoom ${z}`;
}

/* =========================================================
   FOTOS GEOLOCALIZADAS (puntos rojos, 1/4 del tamaño del pin)
   ========================================================= */
function buildFotoIcon(){
  return L.divIcon({
    html: '<div class="foto-point"></div>',
    className: 'foto-div-icon',
    iconSize: [26, 26],
    iconAnchor: [13, 13],
    popupAnchor: [570, 0]
  });
}

// Al hacer clic en un punto rojo, el mapa lo deja centrado verticalmente y
// muy cerca del borde izquierdo (3% del ancho), dejando todo el resto de la
// pantalla libre para la foto ampliada y el panel de Conceptos.
function centrarPinEnPantallaFoto(marker){
  const size = map.getSize();
  const targetPoint = L.point(size.x * 0.25, size.y * 0.50);
  const currentPoint = map.latLngToContainerPoint(marker.getLatLng());
  const delta = currentPoint.subtract(targetPoint);
  map.panBy(delta, { animate: true });
}

function renderFotoMarkers(){
  fotoMarkersLayer.clearLayers();
  if (capaVisible === 'auspicios') return; // solo se muestran los pines
  fotoPoints.forEach(fp => {
    const marker = L.marker([fp.lat, fp.lng], { icon: buildFotoIcon() });
    marker.bindPopup(`<div class="foto-popup-content">Cargando…</div>`, {
      maxWidth: 300, className: 'foto-popup', autoPan: false
    });
    marker.on('click', () => centrarPinEnPantallaFoto(marker));
    marker.on('popupopen', (e) => {
      limitarAlturaFicha(e.popup);
      const popupEl = e.popup.getElement();
      const container = popupEl?.querySelector('.foto-popup-content');
      if (!container) return;
      resolverUrlFoto(fp.foto).then(dataUrl => {
        if (!dataUrl){
          container.innerHTML = '⚠️ La foto no cargó';
          return;
        }
        container.innerHTML = `
          <div class="foto-popup-wrap">
            <img class="foto-popup-img" src="${dataUrl}" alt="Foto">
            <div class="foto-popup-side">
              <label class="foto-popup-label">Conceptos</label>
              ${buildMultiSelectDropdown('conceptos', CONCEPTOS_OPCIONES, fp.conceptos)}
              <button type="button" class="foto-popup-save">💾 Guardar</button>
              <div class="foto-popup-msg"></div>
              <div class="foto-popup-lista-titulo">Elegidos:</div>
              <ul class="foto-popup-lista"></ul>
            </div>
          </div>
        `;
        wireFotoPopupEvents(container, fp);
        // El tamaño real recién se conoce cuando el layout se asienta (y
        // sobre todo cuando la imagen termina de cargar, que es lo que más
        // cambia la altura) — ahí es cuando corregimos si quedó tapada.
        asegurarFichaVisible(popupEl);
        const imgEl = container.querySelector('.foto-popup-img');
        if (imgEl){
          if (imgEl.complete) asegurarFichaVisible(popupEl);
          else imgEl.addEventListener('load', () => asegurarFichaVisible(popupEl));
        }
      });
    });
    marker.addTo(fotoMarkersLayer);
  });
}

function wireFotoPopupEvents(container, fp){
  const dropdown = container.querySelector('.multiselect-dropdown');
  const summary = dropdown.querySelector('.multiselect-summary');
  const hiddenInput = container.querySelector('[data-field="conceptos"]');
  const lista = container.querySelector('.foto-popup-lista');
  const msg = container.querySelector('.foto-popup-msg');
  const saveBtn = container.querySelector('.foto-popup-save');

  function actualizarLista(texto){
    const items = texto.split(',').map(s=>s.trim()).filter(Boolean);
    lista.innerHTML = items.length
      ? items.map(i => `<li>${escapeHtml(i)}</li>`).join('')
      : '<li style="color:var(--text-dim);list-style:none;margin-left:-18px;">(ninguno aún)</li>';
  }
  actualizarLista(fp.conceptos || '');

  summary.addEventListener('click', () => dropdown.classList.toggle('open'));
  dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      cb.closest('.chip-checkbox').classList.toggle('checked', cb.checked);
      const seleccionadas = Array.from(dropdown.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
      const texto = seleccionadas.join(', ');
      hiddenInput.value = texto;
      summary.textContent = texto || 'Elegir…';
      summary.classList.toggle('placeholder', !texto);
      actualizarLista(texto);
    });
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveBtn.textContent = 'Guardando…';
    try{
      await guardarConceptosFoto(fp, hiddenInput.value);
      msg.textContent = 'Guardado ✓';
      msg.style.color = '#00987a';
      showToast('Conceptos guardados');
    }catch(err){
      console.error(err);
      msg.textContent = 'Error: ' + (err.message || 'no se pudo guardar');
      msg.style.color = '#dc2626';
    }finally{
      saveBtn.disabled = false;
      saveBtn.textContent = '💾 Guardar';
    }
  });
}

// Intenta leer coordenadas GPS del EXIF de la foto (funciona con JPG que
// las traiga, típicamente de cámara con GPS o celular sin pasar por WhatsApp).
function procesarFotoParaMapa(file){
  if (typeof EXIF === 'undefined'){
    pedirClicManualParaFoto(file);
    return;
  }
  EXIF.getData(file, function(){
    const lat = EXIF.getTag(this, "GPSLatitude");
    const latRef = EXIF.getTag(this, "GPSLatitudeRef");
    const lng = EXIF.getTag(this, "GPSLongitude");
    const lngRef = EXIF.getTag(this, "GPSLongitudeRef");
    if (lat && lng){
      const latDec = dmsToDecimal_(lat, latRef);
      const lngDec = dmsToDecimal_(lng, lngRef);
      showToast('Ubicación encontrada en la foto');
      guardarFotoEnMapa(file, latDec, lngDec);
    } else {
      pedirClicManualParaFoto(file);
    }
  });
}

function dmsToDecimal_(dms, ref){
  const decimal = dms[0] + dms[1]/60 + dms[2]/3600;
  return (ref === 'S' || ref === 'W') ? -decimal : decimal;
}

function pedirClicManualParaFoto(file){
  pendingFotoBlob = file;
  fotoPending = true;
  const banner = document.getElementById('addModeBanner');
  banner.textContent = 'Esta foto no trae ubicación GPS — haz clic en el mapa donde fue tomada';
  banner.style.display = 'block';
  map.getContainer().style.cursor = 'crosshair';
  showToast('Sin GPS en la foto — haz clic en el mapa para ubicarla');
}

async function guardarFotoEnMapa(fileOrBlob, lat, lng){
  showToast('Subiendo foto…');
  try{
    const dataUrl = await comprimirImagenConLimite(fileOrBlob);
    const nuevo = { id: 'foto-' + Date.now(), lat, lng, foto: dataUrl };
    if (isConfigured()){
      const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'createFoto', data: nuevo })
      });
      const data = await res.json().catch(() => ({}));
      if (data.error) throw new Error(data.error);
      if (data.foto) nuevo.foto = data.foto;
    }
    fotoPoints.push(nuevo);
    renderFotoMarkers();
    showToast('Foto agregada al mapa');
  }catch(err){
    console.error(err);
    alert('No se pudo guardar la foto: ' + err.message);
  }
}

async function loadLocations(){
  setStatus("Cargando ubicaciones…");
  try{
    if (!isConfigured()){
      setStatus("⚠️ Falta configurar APPS_SCRIPT_URL — mostrando datos de ejemplo.");
      locations = demoData();
    } else {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 25000);
      let res;
      try{
        res = await fetch(CONFIG.APPS_SCRIPT_URL + "?action=list", { signal: controller.signal });
      } finally {
        clearTimeout(timeoutId);
      }
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      locations = data.locations || [];
      setStatus(`${locations.length} ubicación(es) · actualizado ${new Date().toLocaleTimeString('es-CL')}`);
    }
    if (isPopupOpen){
      pendingRender = true; // no interrumpir la ficha que se está editando ahora mismo
    } else {
      renderMarkers();
    }
  }catch(err){
    console.error(err);
    const msg = (err.name === 'AbortError')
      ? "⚠️ El servidor (Google Apps Script) tardó demasiado en responder — a veces pasa por su propia latencia, no por el tamaño de los datos."
      : "⚠️ Error al cargar datos. Reintentando en 30s…";
    setStatus(msg);
  }
}

function renderMarkers(){
  markersLayer.clearLayers();
  locations.filter(matchesFilters).forEach(loc => {
    const marker = L.marker([loc.lat, loc.lng], { icon: buildIcon(loc) });
    marker.bindPopup(() => buildFichaHTML(loc), {
      minWidth: 280, autoPanPadding: [40,40],
      autoPan: false,     // el posicionamiento lo maneja nuestro propio centrado
      closeOnClick: false, // el cierre lo controlamos nosotros (ver intentarCerrarFicha)
      closeButton: false   // usamos nuestro propio botón de cerrar, dentro de la ficha
    });
    marker._fichaDirty = () => false;
    marker._fichaGuardar = () => Promise.resolve();
    marker.on('click', () => {
      if (selectedMarker && selectedMarker !== marker){
        intentarCerrarFicha(selectedMarker);
      }
      centrarPinEnPantalla(marker);
    });
    marker.on('popupopen', (e) => {
      const elm = marker.getElement();
      if (elm) elm.classList.add('marker-selected');
      selectedMarker = marker;
      limitarAlturaFicha(e.popup);
      wireFichaEvents(e.popup, loc, marker);
      const fichaEl = e.popup.getElement();
      if (fichaEl) asegurarFichaVisible(fichaEl);
    });
    marker.on('popupclose', () => {
      const elm = marker.getElement();
      if (elm) elm.classList.remove('marker-selected');
      if (selectedMarker === marker) selectedMarker = null;
    });
    marker.addTo(markersLayer);
    loc.__marker = marker;
  });
}

// Cierra una ficha, pero si tiene cambios sin guardar primero pregunta si se
// quieren guardar (en vez de perderlos en silencio). Se usa al hacer clic
// fuera de la ficha, al cambiar de pin, o con el botón de cerrar propio.
function intentarCerrarFicha(marker){
  if (!marker.isPopupOpen() || !marker._fichaDirty()) {
    marker.closePopup();
    return;
  }
  const quiereGuardar = confirm(
    'Tienes cambios sin guardar en esta ficha.\n\n' +
    'Aceptar = guardar y cerrar\nCancelar = cerrar sin guardar'
  );
  if (quiereGuardar){
    marker._fichaGuardar().then(() => marker.closePopup()).catch(err => {
      alert('No se pudo guardar: ' + (err.message || 'error desconocido') + '\nLa ficha se mantiene abierta para que puedas reintentar.');
    });
  } else {
    marker.closePopup();
  }
}

// La ficha nunca puede quedar tapada por el header (ni taparlo ella): se le
// pone un alto máximo real, calculado según el espacio disponible bajo el
// header, con scroll interno si el contenido no cabe.
function limitarAlturaFicha(popup){
  const el = popup.getElement();
  if (!el) return;
  const wrapper = el.querySelector('.leaflet-popup-content-wrapper');
  if (!wrapper) return;
  const headerH = document.querySelector('header').offsetHeight;
  const disponible = window.innerHeight - headerH - 24;
  wrapper.style.maxHeight = disponible + 'px';
  wrapper.style.overflowY = 'auto';
}

// Si el contenido de la ficha crece (por ejemplo al desplegar Objetivos o
// Servicios) y su borde superior queda tapado por el header, desplaza el
// mapa lo justo para dejarla completamente visible.
// Si el contenido de una ficha o ventana emergente queda tapado por el
// header (arriba) o por el panel de filtros (derecha), desplaza el mapa lo
// justo para dejarlo completamente visible en ambos sentidos a la vez.
function asegurarFichaVisible(el){
  const headerH = document.querySelector('header').offsetHeight;
  const panelEl = document.getElementById('filterPanel');
  const margen = 12;
  const rect = el.getBoundingClientRect();
  let offsetX = 0;
  let offsetY = 0;

  if (rect.top < headerH + margen){
    offsetY = -((headerH + margen) - rect.top);
  }
  if (panelEl){
    const panelLeft = panelEl.getBoundingClientRect().left;
    if (rect.right > panelLeft - margen){
      offsetX = rect.right - (panelLeft - margen);
    }
  }
  if (offsetX !== 0 || offsetY !== 0){
    map.panBy([offsetX, offsetY], { animate: true });
  }
}

// Al hacer clic en un pin, el mapa se desplaza para dejarlo centrado
// verticalmente y al 40% del ancho de la pantalla (de izquierda a derecha),
// dejando espacio a la derecha para la ficha.
function centrarPinEnPantalla(marker){
  const size = map.getSize();
  const targetPoint = L.point(size.x * 0.40, size.y * 0.50);
  const currentPoint = map.latLngToContainerPoint(marker.getLatLng());
  const delta = currentPoint.subtract(targetPoint);
  map.panBy(delta, { animate: true });
}

// Al aplicar/quitar un filtro, el mapa se ajusta para que los pines
// resultantes queden a la vista: si queda uno solo, se centra igual que al
// hacer clic (40%/50%); si quedan varios, se hace zoom para que todos entren,
// dejando margen para no quedar tapados por el header ni el panel de filtros.
function ajustarVistaSegunFiltros(){
  const visibles = locations.filter(matchesFilters);
  if (!visibles.length) return;
  if (visibles.length === 1){
    if (visibles[0].__marker) centrarPinEnPantalla(visibles[0].__marker);
    return;
  }
  const bounds = L.latLngBounds(visibles.map(l => [l.lat, l.lng]));
  const headerH = document.querySelector('header').offsetHeight;
  const panelW = document.getElementById('filterPanel').offsetWidth;
  map.fitBounds(bounds, {
    paddingTopLeft: L.point(40, headerH + 30),
    paddingBottomRight: L.point(panelW + 40, 40),
    animate: true
  });
}

/* =========================================================
   NAVEGACIÓN CON TAB ENTRE PINES
   ========================================================= */
let pinCycleIndex = -1;

function moverAlSiguientePin(direccion){
  const visibles = locations.filter(matchesFilters);
  if (!visibles.length) return;
  if (selectedMarker && selectedMarker.isPopupOpen()){
    intentarCerrarFicha(selectedMarker);
  }
  pinCycleIndex = (pinCycleIndex + direccion + visibles.length) % visibles.length;
  const loc = visibles[pinCycleIndex];
  if (loc.__marker){
    centrarPinEnPantalla(loc.__marker);
    loc.__marker.openPopup();
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return;
  const activo = document.activeElement;
  const enFormulario = activo && ['INPUT','TEXTAREA','SELECT'].includes(activo.tagName);
  if (enFormulario) return; // Tab sigue funcionando normal para moverse entre campos de un formulario
  e.preventDefault();
  moverAlSiguientePin(e.shiftKey ? -1 : 1);
});

// Ancho visual del pin y separación pedida: 5 veces ese ancho entre el
// borde del pin y la ficha. El ancho aproximado de la ficha (560px + borde)
// se usa para que popupAnchor.x deje ese hueco exacto a la izquierda de la ventana.
const PIN_WIDTH = 36;
const FICHA_GAP = PIN_WIDTH * 5;          // 180px pedidos
const FICHA_HALF_WIDTH = 281;             // ~mitad de los 562px de la ficha
const FICHA_HALF_HEIGHT_APPROX = 195;     // altura aproximada/2, para centrar verticalmente en el pin

function buildIcon(loc){
  const hasSponsor = !!(loc.auspiciador && String(loc.auspiciador).trim());
  const color = hasSponsor ? 'red' : 'green';
  const label = hasSponsor
    ? `<div class="marker-label">${escapeHtml(loc.auspiciador)}</div>`
    : '';
  const html = `<div class="marker-wrap"><div class="marker-pin ${color}"></div>${label}</div>`;
  return L.divIcon({
    html,
    className: 'crv-div-icon',
    iconSize: [260, 44],
    iconAnchor: [18, 36],
    popupAnchor: [(PIN_WIDTH/2) + FICHA_GAP + FICHA_HALF_WIDTH, FICHA_HALF_HEIGHT_APPROX]
  });
}

        }).join('')}

    </div>
    <input type="hidden" data-field="${campo}" value="${escapeHtml(actual)}">
  `;
}

function wireFichaEvents(popup, loc, marker){
  const el = popup.getElement();
  if (!el) return;
  const btn = el.querySelector('.save-btn');
  const msg = el.querySelector('.save-msg');

  // Rastreo de cambios sin guardar: mientras no se edite nada, la ficha se
  // cierra normalmente. En cuanto se toca cualquier campo, hay que confirmar
  // (guardar o descartar) antes de poder cerrarla — ver intentarCerrarFicha.
  let dirty = false;
  el.querySelectorAll('input, textarea, select').forEach(campo => {
    const marcarEdicionEnCurso = () => { dirty = true; };
    campo.addEventListener('input', marcarEdicionEnCurso);
    campo.addEventListener('change', marcarEdicionEnCurso);
  });
  marker._fichaDirty = () => dirty;

  el.querySelector('.ficha-close-btn').addEventListener('click', () => {
    intentarCerrarFicha(marker);
  });

  // El título y el auspiciador son <textarea> que se auto-ajustan en altura,
  // así el texto siempre se ve completo (pasa a una segunda línea si hace
  // falta) en vez de perderse hacia la derecha.
  function autoAjustarAltura(ta){
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  }
  el.querySelectorAll('.ficha-title-input').forEach(ta => {
    autoAjustarAltura(ta);
    ta.addEventListener('input', () => autoAjustarAltura(ta));
  });

  // Solo el campo Auspiciador se fuerza a mayúscula. El título (nombre) queda
  // libre: se respeta tal cual se escribe, mayúscula solo donde el usuario
  // realmente la tipea, sin transformar el resto del texto.
  el.querySelectorAll('.ficha-auspiciador-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const pos = inp.selectionStart;
      inp.value = inp.value.toUpperCase();
      inp.setSelectionRange(pos, pos);
    });
  });

  // Objetivos y Servicios: desplegables de selección múltiple (no
  // excluyentes). El resumen muestra lo ya elegido separado por comas; al
  // hacer clic se despliegan las demás opciones para seguir marcando.
  // Solo uno puede estar abierto a la vez (abrir uno cierra los demás), y
  // cada vez que el contenido crece se revisa que no quede tapado por el header.
  const todosLosDropdowns = el.querySelectorAll('.multiselect-dropdown');
  todosLosDropdowns.forEach(dropdown => {
    const summary = dropdown.querySelector('.multiselect-summary');
    const hiddenInput = el.querySelector(`[data-field="${dropdown.dataset.campo}"]`);
    summary.addEventListener('click', () => {
      const yaEstabaAbierto = dropdown.classList.contains('open');
      todosLosDropdowns.forEach(d => d.classList.remove('open'));
      if (!yaEstabaAbierto) dropdown.classList.add('open');
      asegurarFichaVisible(el);
    });
    dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        cb.closest('.chip-checkbox').classList.toggle('checked', cb.checked);
        const seleccionadas = Array.from(dropdown.querySelectorAll('input[type="checkbox"]:checked')).map(c => c.value);
        const texto = seleccionadas.join(', ');
        hiddenInput.value = texto;
        summary.textContent = texto || 'Elegir…';
        summary.classList.toggle('placeholder', !texto);
      });
    });
  });

  const photoDrop = el.querySelector('.photo-drop');
  if (photoDrop){
    const img = photoDrop.querySelector('.photo-preview');
    const hint = photoDrop.querySelector('.photo-hint');
    const changeBtn = photoDrop.querySelector('.photo-change-btn');

    function mostrarFoto(src){
      img.src = src;
      img.style.display = 'block';
      hint.style.display = 'none';
      changeBtn.style.display = 'block';
    }
    function ocultarFoto(mensaje){
      img.style.display = 'none';
      changeBtn.style.display = 'none';
      hint.style.display = 'block';
      hint.textContent = mensaje;
    }

    // Si ya hay una foto guardada, pedirle al backend los datos reales
    // (la URL guardada no sirve como src directo — hay que resolverla).
    if (loc.foto){
      resolverUrlFoto(loc.foto).then(dataUrl => {
        if (dataUrl) mostrarFoto(dataUrl);
        else ocultarFoto('⚠️ La foto no cargó — vuelve a pegarla');
      });
    }

    // Botón "Cambiar": deja lista la zona para pegar una foto nueva que
    // reemplaza a la actual (el pegado ya sobrescribe loc.foto siempre).
    changeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      photoDrop.focus();
      showToast('Pega la nueva foto (Ctrl+V) para reemplazarla');
    });

    // Clic en la foto (fuera del botón "Cambiar") la muestra ampliada.
    img.addEventListener('click', () => {
      mostrarFotoAmpliada(img.src);
    });

    photoDrop.addEventListener('paste', (e) => {
      const items = (e.clipboardData || window.clipboardData).items;
      for (const item of items){
        if (item.type.indexOf('image') === 0){
          const blob = item.getAsFile();
          hint.style.display = 'block';
          hint.textContent = 'Procesando imagen…';
          img.style.display = 'none';
          comprimirImagenConLimite(blob).then(dataUrl => {
            loc.foto = dataUrl;
            mostrarFoto(dataUrl);
          }).catch(err => {
            console.error(err);
            ocultarFoto('No se pudo procesar la imagen');
          });
          e.preventDefault();
          e.stopPropagation(); // no debe activar también el pegado global de fotos geolocalizadas
        }
      }
    });
  }

  async function guardarCambiosFicha(){
    const updated = { id: loc.id, foto: loc.foto || '' };
    EDITABLE_FIELDS.forEach(f => {
      const input = el.querySelector(`[data-field="${f}"]`);
      if (input) updated[f] = input.value;
    });
    btn.disabled = true;
    btn.textContent = "Guardando…";
    try{
      const result = await saveLocation(updated);
      // el backend puede devolver la foto ya subida a Drive (URL corta) en vez del base64 original
      if (result && result.foto) updated.foto = result.foto;
      Object.assign(loc, updated);
      if (marker) marker.setIcon(buildIcon(loc));
      dirty = false;
      if (result && result.warning){
        // se guardó todo lo demás, pero la foto específicamente falló al subir
        msg.textContent = result.warning;
        msg.className = "save-msg err";
        showToast("Guardado, pero la foto no se subió");
      } else {
        msg.textContent = "Guardado ✓";
        msg.className = "save-msg ok";
        showToast("Cambios guardados");
      }
    }catch(err){
      console.error(err);
      msg.textContent = "Error: " + (err.message || "no se pudo guardar");
      msg.className = "save-msg err";
      throw err; // para que intentarCerrarFicha sepa que falló y no cierre a ciegas
    }finally{
      btn.disabled = false;
      btn.textContent = "💾 Guardar cambios";
    }
  }
  marker._fichaGuardar = guardarCambiosFicha;

  btn.addEventListener('click', () => { guardarCambiosFicha(); });
}

// Las fotos se guardan como una URL que apunta a este mismo script
// (no se puede usar directo como src de una <img> — Apps Script no permite
// devolver un archivo binario desde un Web App). Esta función le pide al
// backend los datos reales (base64) y arma un data URI utilizable.
// Con caché en memoria (para no repetir el pedido si ya se cargó antes en
// esta sesión) y un tope de tiempo (para que nunca quede pegada esperando).
const cacheFotosResueltas = new Map();

async function resolverUrlFoto(url){
  if (!url) return '';
  if (cacheFotosResueltas.has(url)) return cacheFotosResueltas.get(url);

  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 20000);
  try{
    const res = await fetch(url, { signal: controller.signal });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const dataUrl = data.dataUrl || '';
    if (dataUrl) cacheFotosResueltas.set(url, dataUrl);
    return dataUrl;
  }catch(err){
    if (err.name === 'AbortError'){
      console.error('La foto tardó demasiado en cargar (Apps Script):', url);
    } else {
      console.error('Error al resolver foto:', err);
    }
    return '';
  }finally{
    clearTimeout(timeoutId);
  }
}

async function saveLocation(payload){
  if (!isConfigured()) throw new Error("Backend no configurado");
  const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // evita preflight CORS
    body: JSON.stringify({ action: 'update', data: payload })
  });
  const data = await res.json().catch(() => ({}));
  if (data.error) throw new Error(data.error);
  return data;
}

// Redimensiona/comprime una imagen pegada para que quepa cómodamente
// en el envío al backend (que la sube a Drive, no a la celda del Sheet).
function comprimirImagen(blob, maxDim, calidad){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      if (width > maxDim || height > maxDim){
        const ratio = Math.min(maxDim / width, maxDim / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', calidad));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// Tope de peso real que este dashboard acepta para CUALQUIER foto, suba por
// el método que suba (archivo o Ctrl+V): 280 KB. Se bajó desde 500 KB porque
// Apps Script es lento transfiriendo/codificando datos — fotos más livianas
// se suben y se ven notablemente más rápido. Si tras comprimir sigue
// pesando más, se reintenta automáticamente con menor tamaño/calidad hasta
// lograrlo (o hasta llegar al mínimo que seguimos ofreciendo).
const MAX_FOTO_BYTES = 280 * 1024;                    // 280 KB reales
const MAX_FOTO_BASE64_CHARS = Math.floor(MAX_FOTO_BYTES * 4 / 3 * 0.92); // margen por el overhead del base64

async function comprimirImagenConLimite(blob){
  const intentos = [
    [900, 0.6],
    [700, 0.5],
    [550, 0.4],
    [420, 0.32],
    [320, 0.28],
    [240, 0.25]
  ];
  let dataUrl = null;
  for (const [maxDim, calidad] of intentos){
    dataUrl = await comprimirImagen(blob, maxDim, calidad);
    if (dataUrl.length <= MAX_FOTO_BASE64_CHARS) return dataUrl;
  }
  return dataUrl; // ya es la compresión más agresiva que ofrecemos
}

    superficieDisponible: ""
  };

/* =========================================================
   FILTROS (panel flotante lateral)
   ========================================================= */
const FILTER_FIELDS = [
  { key:'ruido', label:'Ruido', type:'select', options:() => ['1','2','3','4','5'] },
  { key:'soportePrincipal', label:'Soporte ppal', type:'select', options:() => ['Stand','Arco'] },
  { key:'auspiciador', label:'Auspiciador', type:'select', options:() => [...new Set(locations.map(l=>l.auspiciador).filter(Boolean))] },
  { key:'superficieDisponible', label:'Superficie disp.', type:'text' },
  { key:'ofrecidoAuspiciador', label:'Auspiciador posible', type:'text' },
  { key:'objetivos', label:'Objetivos', type:'select', multi:true, options:() => OBJETIVOS_OPCIONES },
  { key:'servicios', label:'Servicios', type:'select', multi:true, options:() => SERVICIOS_OPCIONES }
];
let activeFilters = {};
let capaVisible = null; // null = ambas capas · 'fotos' = solo puntos rojos · 'auspicios' = solo pines

function buildFilterPanel(){
  const panel = document.getElementById('filterPanel');
  panel.innerHTML = renderCapaSection() + FILTER_FIELDS.map(f => renderFilterSection(f)).join('');
  wireFilterPanelEvents();
}

// Sección especial: no filtra por un campo de la ubicación, sino que
// muestra/oculta capas completas del mapa (los pines vs. los puntos rojos).
function renderCapaSection(){
  const opciones = [
    { val:'fotos', label:'Fotos' },
    { val:'auspicios', label:'Auspicios' }
  ];
  const optionsHtml = opciones.map(o =>
    `<span class="filter-chip-opt ${capaVisible===o.val?'selected':''}" data-capa="${o.val}">${o.label}</span>`
  ).join('');
  return `
    <div class="filter-section ${capaVisible?'active':''}">
      <div class="filter-section-title">Mostrar</div>
      <div class="filter-section-options">${optionsHtml}</div>
    </div>
  `;
}

function renderFilterSection(f){
  const current = activeFilters[f.key];
  let optionsHtml;
  if (f.type === 'select'){
    const opts = f.options();
    optionsHtml = opts.length
      ? opts.map(o =>
          `<span class="filter-chip-opt ${current===o?'selected':''}" data-key="${f.key}" data-val="${o}">${o}</span>`
        ).join('')
      : `<span class="filter-empty">Sin datos aún</span>`;
  } else if (f.type === 'presence'){
    optionsHtml = ['Con','Sin'].map(o =>
      `<span class="filter-chip-opt ${current===o?'selected':''}" data-key="${f.key}" data-val="${o}">${o}</span>`
    ).join('');
  } else {
    optionsHtml = `<input type="text" class="filter-text-input" data-key="${f.key}" placeholder="Buscar…" value="${current||''}">`;
  }
  return `
    <div class="filter-section ${current?'active':''}">
      <div class="filter-section-title">${f.label}</div>
      <div class="filter-section-options">${optionsHtml}</div>
    </div>
  `;
}

function wireFilterPanelEvents(){
  const panel = document.getElementById('filterPanel');
  panel.querySelectorAll('.filter-chip-opt[data-capa]').forEach(chip => {
    chip.addEventListener('click', () => {
      const val = chip.dataset.capa;
      capaVisible = (capaVisible === val) ? null : val;
      renderMarkers();
      renderFotoMarkers();
      buildFilterPanel();
      ajustarVistaSegunFiltros();
    });
  });
  panel.querySelectorAll('.filter-chip-opt[data-key]').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.key;
      const val = chip.dataset.val;
      if (activeFilters[key] === val) delete activeFilters[key];
      else activeFilters[key] = val;
      renderMarkers();
      buildFilterPanel();
      ajustarVistaSegunFiltros();
    });
  });
  panel.querySelectorAll('.filter-text-input').forEach(input => {
    input.addEventListener('input', () => {
      const v = input.value.trim();
      if (v) activeFilters[input.dataset.key] = v; else delete activeFilters[input.dataset.key];
      renderMarkers();
      ajustarVistaSegunFiltros();
      // No reconstruimos el panel aquí para no perder el foco mientras se escribe.
    });
  });
}

function matchesFilters(loc){
  if (capaVisible === 'fotos') return false; // solo se muestran los puntos rojos
  return FILTER_FIELDS.every(f => {
    const val = activeFilters[f.key];
    if (!val) return true;
    if (f.type === 'select'){
      if (f.multi){
        const values = String(loc[f.key]||'').split(',').map(s=>s.trim());
        return values.includes(val);
      }
      return String(loc[f.key]) === val;
    }
    if (f.type === 'presence'){
      const has = !!(loc[f.key] && String(loc[f.key]).trim());
      return val === 'Con' ? has : !has;
    }
    const source = f.matchKeys ? f.matchKeys.map(k => loc[k]||'').join(' ') : (loc[f.key]||'');
    return String(source).toLowerCase().includes(val.toLowerCase());
  });
}

/* =========================================================
   CLAVE GLOBAL (desbloquea Ruido / Superficie disponible
   en TODAS las fichas, guardado en este navegador)
   ========================================================= */
function updateLockButton(){
  const btn = document.getElementById('btnLock');
  btn.textContent = unlockedGlobal ? '🔓 Editable' : '🔒 Bloqueado';
  btn.classList.toggle('active', unlockedGlobal);
}

function renderLockPopoverContent(){
  if (unlockedGlobal){
    return `
      <h4>🔓 Edición desbloqueada</h4>
      <div style="font-size:.72rem;color:var(--text-dim);margin-bottom:8px;">
        Ruido y Superficie disponible son editables en todas las fichas, en este computador.
      </div>
      <button class="filter-clear" id="btnRelock">Bloquear de nuevo</button>
    `;
  }
  const letras = "AUSPICIOS".split('');
  return `
    <h4>🔒 Clave para editar Ruido / Superficie disponible</h4>
    <div class="clave-boxes" id="lockClaveBoxes">
      ${letras.map((ch,i) => `<div class="clave-box" data-idx="${i}">${ch}</div>`).join('')}
    </div>
  `;
}

function openLockPopover(){
  const pop = document.getElementById('lockPopover');
  const btn = document.getElementById('btnLock');
  const rect = btn.getBoundingClientRect();
  pop.style.top = (rect.bottom + 8) + 'px';
  pop.style.right = (window.innerWidth - rect.right) + 'px';
  pop.innerHTML = renderLockPopoverContent();
  pop.classList.add('show');
  wireLockPopoverEvents();
}

function closeLockPopover(){
  document.getElementById('lockPopover').classList.remove('show');
}

function wireLockPopoverEvents(){
  if (unlockedGlobal){
    const relockBtn = document.getElementById('btnRelock');
    if (relockBtn){
      relockBtn.addEventListener('click', () => {
        unlockedGlobal = false;
        localStorage.removeItem(LOCK_KEY);
        updateLockButton();
        closeLockPopover();
        renderMarkers();
      });
    }
    return;
  }
  const boxes = document.querySelectorAll('#lockClaveBoxes .clave-box');
  let progreso = 0;
  const usados = new Set();
  boxes.forEach(box => {
    box.addEventListener('click', () => {
      const idx = Number(box.dataset.idx);
      if (usados.has(idx)) return;
      const letra = box.textContent;
      if (letra === CLAVE_SECUENCIA[progreso]){
        usados.add(idx);
        box.classList.add('clave-ok');
        progreso++;
        if (progreso === CLAVE_SECUENCIA.length){
          unlockedGlobal = true;
          localStorage.setItem(LOCK_KEY, '1');
          updateLockButton();
          showToast('Edición desbloqueada en este computador');
          renderMarkers();
          setTimeout(openLockPopover, 250);
        }
      } else {
        progreso = 0;
        usados.clear();
        boxes.forEach(b => b.classList.remove('clave-ok'));
        box.classList.add('clave-err');
        setTimeout(() => box.classList.remove('clave-err'), 350);
      }
    });
  });
}

document.getElementById('btnLock').addEventListener('click', () => {
  const pop = document.getElementById('lockPopover');
  if (pop.classList.contains('show')) closeLockPopover();
  else openLockPopover();
});

document.addEventListener('click', (e) => {
  const pop = document.getElementById('lockPopover');
  const btn = document.getElementById('btnLock');
  if (pop.classList.contains('show') && !pop.contains(e.target) && !btn.contains(e.target)){
    closeLockPopover();
  }
});

/* =========================================================
   UTILIDADES
   ========================================================= */
function setStatus(t){ document.getElementById('statusText').textContent = t; }

function showToast(t){
  const el = document.getElementById('toast');
  el.textContent = t;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// Ventana emergente con la foto ampliada; se cierra al hacer clic afuera de la imagen.
function mostrarFotoAmpliada(src){
  const overlay = document.createElement('div');
  overlay.className = 'foto-lightbox-overlay';
  overlay.innerHTML = `<img src="${src}" class="foto-lightbox-img" alt="Foto ampliada">`;
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.remove();
  });
  document.body.appendChild(overlay);
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

   ARRANQUE
   ========================================================= */
document.getElementById('btnAddMode').addEventListener('click', toggleAddMode);
document.getElementById('btnRefresh').addEventListener('click', () => { loadLocations(); loadFotoPoints(); });
document.getElementById('btnAddFoto').addEventListener('click', () => {
  marcarBotonFotoUsado('elegir');
  document.getElementById('fotoFileInput').click();
});
document.getElementById('fotoFileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) procesarFotoParaMapa(file);
  e.target.value = '';
});

function marcarBotonFotoUsado(cual){
  document.getElementById('btnAddFoto').classList.toggle('selected', cual === 'elegir');
  document.getElementById('pasteZone').classList.toggle('selected', cual === 'pegar');
}

// Zona de pegado dedicada: clic aquí y Ctrl+V pega una imagen del portapapeles
// y la geolocaliza — funciona junto con (no en vez de) el botón "Elige foto".
const pasteZone = document.getElementById('pasteZone');
pasteZone.addEventListener('paste', (e) => {
  const cd = e.clipboardData || window.clipboardData;
  let blob = null;
  if (cd && cd.items){
    for (const item of cd.items){
      if (item.type && item.type.indexOf('image') === 0){ blob = item.getAsFile(); break; }
    }
  }
  if (!blob && cd && cd.files && cd.files.length && cd.files[0].type.indexOf('image') === 0){
    blob = cd.files[0];
  }
  if (blob){
    e.preventDefault();
    marcarBotonFotoUsado('pegar');
    pasteZone.classList.add('paste-ok');
    setTimeout(() => pasteZone.classList.remove('paste-ok'), 500);
    procesarFotoParaMapa(blob);
  } else {
    showToast('No se detectó ninguna imagen en el portapapeles');
  }
});

updateLockButton();
buildFilterPanel();
initMap();
loadLocations();
loadFotoPoints();
setInterval(() => { loadLocations(); loadFotoPoints(); }, CONFIG.AUTO_REFRESH_MS);
